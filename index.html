    <link rel="apple-touch-startup-image" href="/splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..700&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <title>Éclat by Harsha</title>
    <!-- Splash: inline so it paints before any JavaScript loads. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background-color: #f8f2ea;
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.32, 0.72, 0, 1);
      }
      /* Handoff: backdrop and line fade, the logo itself flies to the header. */
      #splash.handoff {
        background: transparent;
        transition: background-color 0.7s ease;
        pointer-events: none;
      }
      #splash.handoff .splash-line,
      #splash.handoff #splash-retry {
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .splash-logo {
        will-change: transform;
      }
      #splash.leaving {
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
      }
      .splash-logo {
        width: min(62vw, 280px);
        aspect-ratio: 657 / 274;
        background: linear-gradient(100deg, #3f1715 0 40%, #d9b98a 50%, #3f1715 60% 100%);
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-mask: url("/logo.svg") center / contain no-repeat;
        mask: url("/logo.svg") center / contain no-repeat;
        clip-path: inset(0 100% 0 0);
        /* Brush-stroke reveal, then a slow gold shimmer while the app loads. */
        animation:
          splash-reveal 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards,
          splash-shimmer 2.2s cubic-bezier(0.45, 0, 0.55, 1) 1.4s infinite;
      }
      .splash-line {
        width: 72px;
        height: 1px;
        background: rgba(158, 118, 80, 0.25);
        overflow: hidden;
        opacity: 0;
        animation: splash-fade 0.5s ease 0.9s forwards;
      }
      .splash-line::after {
        content: "";
        display: block;
        height: 100%;
        background: #9e7650;
        transform-origin: left;
        animation: splash-load 1.6s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite;
      }
      /* Installed app: the phone's own launch screen already showed the logo,
         so start with it in place and go straight to the shimmer. */
      #splash.instant .splash-logo {
        clip-path: none;
        animation: splash-shimmer 2.2s cubic-bezier(0.45, 0, 0.55, 1) 0.2s infinite;
      }
      /* Match the phone's launch screen exactly: same logo size (Android
         draws it at a fixed ~168px wide) and dead centre, with the gold line
         hung below so it doesn't push the logo up. */
      /* The phone's launch screen draws the app icon in a ~300px box, so the
         logo appears at icon-box x logo share, dropped by the icon's offset.
         Values mirror the icon generator (MASKABLE_FRAC, DROP). */
      #splash.instant {
        --splash-icon: 300px;
        --logo-frac: 0.66;
        --logo-drop: 0.045;
      }
      #splash.instant .splash-logo {
        width: calc(var(--splash-icon) * var(--logo-frac));
        position: relative;
        top: calc(var(--splash-icon) * var(--logo-drop));
      }
      #splash.instant .splash-line {
        position: absolute;
        top: calc(50% + var(--splash-icon) * var(--logo-drop) + 58px);
        left: 50%;
        margin-left: -36px;
        animation-delay: 0.1s;
      }
      @keyframes splash-reveal {
        to { clip-path: inset(0 0 0 0); }
      }
      @keyframes splash-shimmer {
        from { background-position: 100% 0; }
        to { background-position: 0% 0; }
      }
      @keyframes splash-fade {
        to { opacity: 1; }
      }
      @keyframes splash-load {
        0% { transform: scaleX(0); transform-origin: left; }
        50% { transform: scaleX(1); transform-origin: left; }
        51% { transform-origin: right; }
        100% { transform: scaleX(0); transform-origin: right; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo { clip-path: none; opacity: 0; animation: splash-fade 0.4s ease forwards; }
        .splash-line { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="Éclat by Harsha, loading">
      <div class="splash-logo"></div>
      <div class="splash-line"></div>
      <button id="splash-retry" type="button" onclick="location.reload()" hidden
        style="margin-top:8px;border:1.5px solid #420c15;border-radius:999px;background:transparent;color:#420c15;font:500 15px/1 -apple-system,sans-serif;padding:12px 22px">
        Couldn't open. Tap to try again
      </button>
    </div>
    <script>
      if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
        document.getElementById("splash").classList.add("instant");
      }
      // Safety net: if the app hasn't started after 10 s (failed download or
      // script error), offer a reload instead of leaving the logo up forever.
      setTimeout(function () {
        var root = document.getElementById("root");
        var splash = document.getElementById("splash");
        if (splash && root && !root.children.length) {
          document.getElementById("splash-retry").hidden = false;
          var line = document.querySelector(".splash-line");
          if (line) line.style.display = "none";
        }
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
